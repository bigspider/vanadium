[package]
name = "vanadium-app-sdk"
version = "0.1.0"
edition.workspace = true

[dependencies]
common = { path = "../common", default-features = false }
critical-section = "1.1.2"
subtle = { version="2.6.1", default-features = false }
hex-literal = "0.4.1"
vanadium_macros = { path = "../macros" }
zeroize = "1.8.1"

# target_vanadium_ledger dependencies (optional)
embedded-alloc = { version = "0.5.1", optional = true }
vanadium-ecalls = { path = "../ecalls", default-features = false, optional = true }

# Optional graphics support.
# `embedded-graphics` enables the `Canvas` DrawTarget impl (works on both targets).
# The native target also serves an interactive browser viewer (app-sdk/src/webui),
# which needs no extra dependency.
embedded-graphics = { version = "0.8.1", optional = true }

# Native-only `native-window` feature: open the viewer in a real OS window via an
# embedded webview instead of the browser. On Linux this needs WebKitGTK
# (libwebkit2gtk-4.1-dev); macOS/Windows use the system webview.
wry = { version = "0.37", optional = true }
tao = { version = "0.24", optional = true }

# Web (wasm32) runtime: expose the generic device shell to JS. Version pinned to the
# workspace's wasm-bindgen (must match the installed `wasm-bindgen-cli`).
wasm-bindgen = { version = "=0.2.105", optional = true }

# target_native dependencies (optional)
bip32 = { version = "0.5.2", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.12.1", optional = true }
k256 = { version = "0.13.4", default-features = false, features = ["alloc", "ecdsa-core", "schnorr"], optional = true }
lazy_static = { version = "1.5.0", optional = true }
num-bigint = { version = "0.4.6", optional = true }
num-traits = { version = "0.2.19", optional = true }
rand = { version = "0.9.1", optional = true }
ripemd = { version = "0.1.3", optional = true }
sha2 = { version = "0.10.8", optional = true }
sha3 = { version = "0.10", optional = true }

[features]
default = ["target_native"]
target_native = [
    "common/target_native",
    # The native backend rasterizes text into the virtual framebuffer with
    # embedded-graphics, so the simulator/browser viewer shows the same text the
    # device draws. Pulled in unconditionally so a plain `cargo build` (default
    # features) renders text without each V-App having to opt in.
    "embedded-graphics",
    "dep:bip32",
    "dep:hex",
    "dep:hmac",
    "dep:k256",
    "dep:lazy_static",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:rand",
    "dep:ripemd",
    "dep:sha2",
    "dep:sha3",
]
target_vanadium_ledger = [
    "common/target_vanadium_ledger",
    "dep:embedded-alloc",
    "vanadium-ecalls/target_vanadium_ledger",
]
# Run a V-App inside a web page (wasm32-unknown-unknown). std is available (minus
# net/threads/fs), so this mirrors target_native's structure with I/O bridged to the JS
# host. See app-sdk/src/ecalls_wasm.rs and the cooperative runtime.
target_wasm = [
    "common/target_wasm",
    "embedded-graphics",
    "dep:wasm-bindgen",
    # Pure-Rust crypto, shared with the native backend (no `rand`: randomness comes from
    # the JS host).
    "dep:bip32",
    "dep:hmac",
    "dep:k256",
    "dep:num-bigint",
    "dep:num-traits",
    "dep:ripemd",
    "dep:sha2",
    "dep:sha3",
]

# Enable this in V-App's dev-dependencies
test-mode = []

# Graphics: the `Canvas` embedded-graphics DrawTarget abstraction.
embedded-graphics = ["dep:embedded-graphics"]

# Native-only: show the viewer in a native OS window (embedded webview) and open it
# automatically, instead of pointing a browser at the local URL. Opt-in so the default
# build stays dependency-free. Requires `target_native`.
native-window = ["dep:wry", "dep:tao"]

[dev-dependencies]
serde_json = "1"

[build-dependencies]
common = { path = "../common", features = ["wrapped_serializable"] }
