[package]
name = "vnd-test"
version = "0.1.0"
edition = "2021"

[package.metadata.vapp]
name = "Test"
stack_size = 65536

[features]
default = ["target_native"]
target_native = ["sdk/target_native", "sdk/embedded-graphics"]
target_vanadium_ledger = ["sdk/target_vanadium_ledger", "sdk/embedded-graphics"]

[dependencies]
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
embedded-graphics = "0.8.1"
# Experimental: immediate-mode GUI on top of embedded-graphics. Pinned to a commit since
# crates.io only carries an old alpha. no_std, no allocator (uses heapless).
kolibri-embedded-gui = { git = "https://github.com/Yandrik/kolibri", rev = "b91fdd88f25c0b684313cdfbcac5399c69eb98c8" }
sdk = { package = "vanadium-app-sdk", path = "../../../app-sdk", default-features = false }
sha2 = { version = "0.10.8", default-features = false }

[workspace]
