[target.riscv32imac-unknown-none-elf]
rustflags = [
  # The VM expects ELF binaries with 2 segments (rx and rw). Don't put
  # read-only non-executable sections in their own segment.
  "-Clink-arg=--no-rosegment",
]

[env]
RUST_TEST_THREADS = "1"
# A full-screen Gray4 Canvas on Flex/Stax (~144 KB) lives in the V-App heap, used by the
# `kolibri` GUI demo (which draws via embedded-graphics into a full framebuffer). Raise
# the default 64 KB heap so it fits (mirrors apps/sadik). Read by app-sdk/build.rs.
VAPP_HEAP_SIZE = "262144"
