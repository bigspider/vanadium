[target.riscv32imac-unknown-none-elf]
rustflags = [
  # The VM expects ELF binaries with 2 segments (rx and rw). Don't put
  # read-only non-executable sections in their own segment.
  "-Clink-arg=--no-rosegment",
]

[env]
RUST_TEST_THREADS = "1"
# Headroom for graphics demos that allocate a full-screen Gray4 Canvas on Flex/Stax
# (~144 KB) in the V-App heap; the default is 64 KB (mirrors apps/sadik). Read by
# app-sdk/build.rs.
VAPP_HEAP_SIZE = "262144"
