<!DOCTYPE html>
<!--
  Browser demo: an interactive Vanadium V-App running entirely in the page as WebAssembly,
  no server and no device. The handler draws a tap counter and awaits touch input; clicks
  on the canvas are fed to it via the step driver.

    cargo build --target wasm32-unknown-unknown
    cp target/wasm32-unknown-unknown/debug/wasm_echo.wasm .
    python3 -m http.server   # open http://localhost:8000/
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vanadium V-App in WASM — interactive demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 32px auto; }
  #screen { border: 1px solid #ccc; image-rendering: pixelated; cursor: pointer; }
  #log { white-space: pre-wrap; color: #555; margin-top: 8px; }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body>
<h1>Vanadium V-App running in WebAssembly</h1>
<p>The handler runs entirely in your browser — it draws a counter and waits for input.
   Click the screen to tap; the wasm handler suspends between taps and resumes when you
   click. Press <b>Quit</b> to end it.</p>
<p><button id="quit">Quit</button></p>
<canvas id="screen"></canvas>
<div id="log">loading wasm…</div>

<script type="module">
const dec = new TextDecoder();
const log = (s) => { document.getElementById("log").textContent = s; };

let mem;
const env = {
  host_print: (ptr, len) => console.log("[vapp]", dec.decode(new Uint8Array(mem.buffer, ptr, len))),
  host_random: (ptr, len) => crypto.getRandomValues(new Uint8Array(mem.buffer, ptr, len)),
  host_exit: (code) => { throw new Error("vapp exited: " + code); },
  host_fatal: (ptr, len) => { throw new Error("vapp fatal: " + dec.decode(new Uint8Array(mem.buffer, ptr, len))); },
};

const { instance } = await WebAssembly.instantiateStreaming(fetch("wasm_echo.wasm"), { env });
const ex = instance.exports;
mem = ex.memory;

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
function paint() {
  const w = ex.fb_width(), h = ex.fb_height();
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
  const fb = new Uint8Array(mem.buffer, ex.fb_ptr(), w * h);
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < fb.length; i++) {
    const v = Math.round((fb[i] * 255) / 15);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

let done = false;
function drive() {
  const r = ex.app_poll(); // BigInt: -1n while waiting for input, else response length
  paint();
  if (r !== -1n) {
    done = true;
    log("handler finished: " + dec.decode(new Uint8Array(mem.buffer, ex.io_ptr(), Number(r))));
  }
}

ex.app_init();
ex.app_start(0); // empty command -> start the interactive counter
drive();         // initial draw ("Taps: 0")
log("ready — click the screen to tap.");

canvas.addEventListener("pointerdown", (e) => {
  if (done) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * canvas.width / rect.width);
  const y = Math.floor((e.clientY - rect.top) * canvas.height / rect.height);
  ex.app_push_touch(x, y, 1);
  drive();
});
document.getElementById("quit").addEventListener("click", () => {
  if (done) return;
  ex.app_push_quit();
  drive();
});
</script>
</body>
</html>
