[package]
name = "wasm-bitcoin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
sdk = { package = "vanadium-app-sdk", path = "../../app-sdk", default-features = false, features = ["target_wasm"] }
# The real Bitcoin host client (BitcoinClient) built for wasm: it re-exports the co-resident
# transport (WasmAppTransport), the cooperative step driver (WasmClientDriver) and the
# Bitcoin message types.
client = { package = "vnd-bitcoin-client", path = "../bitcoin/client", default-features = false, features = ["wasm"] }
# The real Bitcoin V-App (process_message handler), built for wasm and co-resident.
vnd_bitcoin = { package = "vnd-bitcoin", path = "../bitcoin/app", default-features = false, features = ["target_wasm"] }
# For base58check-encoding the returned extended pubkey into an `xpub`/`tpub` string.
bitcoin = { version = "0.32.0", default-features = false }

[workspace]

# The Bitcoin app's crypto crates route through the SDK ECALLs; replicate its patches here
# (this is a separate workspace, so it doesn't inherit them).
[patch.crates-io.bitcoin_hashes]
path = "../../libs/bitcoin_hashes"
[patch.crates-io.secp256k1]
path = "../../libs/secp256k1"
[patch.crates-io.base58ck]
path = "../../libs/base58"
[patch.crates-io.getrandom]
path = "../../libs/getrandom"
