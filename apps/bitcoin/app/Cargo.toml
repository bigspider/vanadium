[package]
name = "vnd-bitcoin"
version = "0.1.0"
edition = "2021"

[package.metadata.vapp]
name = "Bitcoin"
stack_size = 65536
n_storage_slots = 3

[features]
# Native runs open the simulator in an OS window by default; opt out with
# `--no-default-features --features target_native` to get the browser viewer (and drop
# the WebKitGTK dependency).
default = ["target_native", "native-window"]
target_native = [
    "sdk/target_native",
    "hashes/target_native",
    "secp256k1/target_native",
    "base58/target_native",
    "common/target_native"
]
target_vanadium_ledger = [
    "sdk/target_vanadium_ledger",
    "hashes/target_vanadium_ledger",
    "secp256k1/target_vanadium_ledger",
    "base58/target_vanadium_ledger",
    "common/target_vanadium_ledger"
]
target_wasm = [
    "sdk/target_wasm",
    "hashes/target_wasm",
    "secp256k1/target_wasm",
    "base58/target_wasm",
    "common/target_wasm",
    # Co-resident host client + wasm-bindgen, so the real BitcoinClient is callable from JS.
    "dep:vnd-bitcoin-client",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
]
autoapprove = []  # used for integration tests
fixed_resident_seed = []  # always use a fixed resident seed (only for testing/development)
# Native dev only: show the simulator in an OS window (embedded webview) instead of a
# browser. Needs WebKitGTK on Linux (libwebkit2gtk-4.1-dev).
native-window = ["sdk/native-window"]

[dependencies]
bitcoin = { version = "0.32.0", features = ["serde"], default-features = false }
hashes   = { package = "bitcoin_hashes", version = "0.14", default-features = false, features = ["alloc", "io"] }
secp256k1 = { package = "secp256k1", version = "0.29", default-features = false }
base58   = { package = "base58ck", version = "0.1", default-features = false }

common = { package = "vnd-bitcoin-common", path = "../common", default-features = false }
# Co-resident host client + wasm-bindgen glue, only for the wasm32 build (architecture A).
vnd-bitcoin-client = { path = "../client", default-features = false, features = ["wasm"], optional = true }
wasm-bindgen = { version = "=0.2.105", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = "0.4.1"
minicbor = { version = "2.2", default-features = false, features = ["alloc", "derive"] }
nom = { version = "7.1.3", default-features = false, features = ["alloc"] }
sdk = { package = "vanadium-app-sdk", path = "../../../app-sdk", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[dev-dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
sdk = { package = "vanadium-app-sdk", path = "../../../app-sdk", default-features = false, features = ["test-mode", "target_native"] }

[profile.release]
opt-level = "s"
lto = true
# improves LTO performance and code size (but it slows down compilation a bit)
codegen-units = 1

[workspace]

[patch.crates-io.bitcoin_hashes]
path = "../../../libs/bitcoin_hashes"
[patch.crates-io.secp256k1]
path = "../../../libs/secp256k1"
[patch.crates-io.base58ck]
path = "../../../libs/base58"
[patch.crates-io.getrandom]
path = "../../../libs/getrandom"
