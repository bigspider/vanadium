[package]
name = "vnd-bitcoin-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]

# Native client backend. The native `BitcoinClient` speaks the chunked `comm` protocol over a
# real transport, so it pulls client-sdk's full `transport` stack — HID/TCP plus the Vanadium
# VM engine, which needs common's `client_commands` (hence `target_vanadium_ledger`). The
# crypto crates (secp256k1/bitcoin_hashes/base58ck) are the real upstream crates here — the
# client runs host-side — so they take no target feature. There is no partial native build.
target_native = [
    "sdk/transport",
    "sdk/target_native",
    "sdk/target_vanadium_ledger",
    "common/target_native",
]

# Co-resident client in a web page (wasm32, architecture A): the client and the V-App run in
# one wasm module — no native transport, no CLI. Under the wasm-bitcoin workspace the crypto
# crates are patched to the local ECALL-routing versions, and the co-resident app enables
# their `target_wasm` backend (feature-unified across the build).
wasm = ["sdk/wasm", "common/target_wasm"]

# The interactive CLI binary (native only): the front-end deps (clap/rustyline/HID/tokio) and
# unpackaged-V-App loading. Gated so the library can build for wasm without them.
cli = [
    "target_native",
    "sdk/cargo_toml",
    "dep:clap",
    "dep:rustyline",
    "dep:shellwords",
    "dep:base64",
    "dep:hidapi",
    "dep:tokio",
]

debug = ["dep:env_logger", "sdk/debug"]
speculos-tests = []

[dependencies]
bitcoin = { version = "0.32.0", features = ["serde"], default-features = false }
hashes   = { package = "bitcoin_hashes", version = "0.14", default-features = false, features = ["alloc", "io"] }
secp256k1 = { package = "secp256k1", version = "0.29", default-features = false }
base58   = { package = "base58ck", version = "0.1", default-features = false }

common = { package = "vnd-bitcoin-common", path = "../common", default-features = false }
hex = "0.4.3"
minicbor = { version = "2.2", default-features = false, features = ["alloc", "derive", "std"] }
sdk = { package = "vanadium-client-sdk", path = "../../../client-sdk", default-features = false }

# CLI-only dependencies (the `vnd_bitcoin_cli` binary). Gated behind the `cli` feature so
# they are never pulled into a wasm library build.
clap = { version = "4.5.31", features = ["derive"], optional = true }
rustyline = { version = "15.0.0", optional = true }
shellwords = { version = "1.1.0", optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"], optional = true }
hidapi = { version = "2.6.3", optional = true }
tokio = { version = "1.38.1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync"], optional = true }
env_logger = { version = "0.11.8", optional = true }

[dev-dependencies]
sdk = { package = "vanadium-client-sdk", path = "../../../client-sdk", features = ["test-utils"] }


[lib]
name = "vnd_bitcoin_client"
path = "src/lib.rs"

[[bin]]
name = "vnd_bitcoin_cli"
path = "src/main.rs"
required-features = ["cli"]


[workspace]
